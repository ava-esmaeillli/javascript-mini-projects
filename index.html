<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mini Projects</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            color: white;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1f2937;
            padding: 25px;
            border-radius: 12px;
        }

        .card h2 {
            margin-top: 0;
        }

        .card a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
        }

        .card a:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>JavaScript Mini Projects</h1>


    <div class="projects">

        <div class="card">
            <h2>Expense Tracker</h2>
            <p>
                Track expenses using JavaScript and LocalStorage.
            </p>

            <a href="./expense-tracker/index.html">
                View Demo
            </a>
        </div>


    </div>


</body>

</html>
