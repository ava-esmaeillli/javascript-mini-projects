<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Expense Tracker</title>
</head>

<body>
    <main id="expenseTracker">
        <h1>Expense Tracker</h1>
        <p>Manage your daily expenses</p>
        <form action="" id="expenseForm">
            <label for="">
                Title:
                <input type="text" name="" id="titleInput">
            </label>
            <label for="">
                Amount:
                <input type="number" name="" id="amountInput">
            </label>
            <label for="">
                Category:
                <select name="" id="categorySelect">
                    <option value="" disabled selected>Select Category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="shopping">Shopping</option>
                </select>
            </label>
            <button type="button" id="addBtn" data-action="Add">Add</button>
        </form>

        <div id="filters">
            <label for="">
            Sort:
            <select id="sortFilter">
                <option value="all">All</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
            </select>
        </label>
        <label for="">
            Category:
            <select id="categoryFilter">
                <option value="all">All</option>
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="shopping">Shopping</option>
            </select>
        </label>
        </div>
        <h3 id="totalAmount"></h3>
        <ul id="expenseList"></ul>
    </main>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
